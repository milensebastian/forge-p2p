# ==============================================================================
# FORGE Signaling Server Nginx Reverse Proxy Configuration
# Handles HTTPS, WSS (WebSocket Secure), and proxy pass-through to 127.0.0.1:4444
# ==============================================================================

# Rate limiting zone to protect signaling server from connection floods
limit_req_zone $binary_remote_addr zone=signaling_limit:10m rate=30r/s;

# Upstream Node.js signaling process
upstream forge_signaling_upstream {
    server 127.0.0.1:4444;
    keepalive 64;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name signaling.example.com; # Replace with your signaling domain

    # Let's Encrypt ACME challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS & WSS server block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name signaling.example.com; # Replace with your signaling domain

    # SSL Certificates (managed via Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/signaling.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/signaling.example.com/privkey.pem;

    # Modern TLS Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Health check endpoint
    location = /health {
        proxy_pass http://forge_signaling_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Root WebSocket / Signaling Route
    location / {
        limit_req zone=signaling_limit burst=50 nodelay;

        proxy_pass http://forge_signaling_upstream;
        proxy_http_version 1.1;

        # Crucial headers for WebSocket handshake upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forwarded Client Info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for persistent WebRTC signaling connections (default is 60s)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;

        # Disable buffering for real-time WebSocket frames
        proxy_buffering off;
    }
}

