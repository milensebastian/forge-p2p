# ==============================================================================
# Coturn TURN/STUN Server Configuration for FORGE
# Relay server for peers behind symmetric NAT or corporate firewalls
# ==============================================================================

# Public STUN / TURN listening ports
listening-port=3478
tls-listening-port=5349

# Listening IP addresses (0.0.0.0 listens on all interfaces)
listening-ip=0.0.0.0

# External public IP of your VPS (Replace with your actual VPS public IP)
# external-ip=YOUR_VPS_PUBLIC_IP

# Relay UDP port range for media and data channels
min-port=49152
max-port=65535

# Verbose logging (uncomment for debugging)
# verbose

# Credentials mechanism: Long-Term Credentials
lt-cred-mech

# Realm (domain name for your TURN server)
realm=turn.example.com

# Static User Credentials (Template - replace with secure values or use turnadmin)
# Format: user=username:password
# user=forge_peer:CHANGE_ME_TO_A_SECURE_RANDOM_PASSWORD

# Security configurations
fingerprint
no-cli
no-tcp-relay
stale-nonce=600

# TLS Configuration (if terminating TLS directly on Coturn)
# cert=/etc/letsencrypt/live/turn.example.com/fullchain.pem
# pkey=/etc/letsencrypt/live/turn.example.com/privkey.pem

