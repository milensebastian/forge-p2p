name: Deploy FORGE Signaling Server to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'packages/collaboration/**'
      - 'deploy/**'
      - '.github/workflows/deploy-signaling.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests & Build Check
        run: |
          npm test
          npx tsc -b

      - name: Deploy to Production VPS via SSH
        if: ${{ env.VPS_HOST != '' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "==> Deploying FORGE Signaling Server..."
            DEPLOY_DIR=${DEPLOY_DIR:-/opt/forge}
            if [ ! -d "$DEPLOY_DIR" ]; then
              echo "Directory $DEPLOY_DIR not found. Please clone repo first."
              exit 1
            fi
            cd "$DEPLOY_DIR"
            git fetch origin main
            git reset --hard origin/main
            npm ci --omit=dev
            # Restart persistent process manager (PM2 or systemd)
            if command -v pm2 > /dev/null; then
              pm2 reload deploy/ecosystem.config.cjs --env production || pm2 start deploy/ecosystem.config.cjs --env production
              pm2 save
            elif systemctl is-active --quiet forge-signaling; then
              sudo systemctl restart forge-signaling
            fi
            echo "==> Deployment complete!"
